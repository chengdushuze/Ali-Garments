name = "ali-garments"
compatibility_date = "2024-09-23"
pages_build_output_dir = "dist"

# 1. Primary Cloudflare D1 Database Binding
[[d1_databases]]
binding = "DB"
database_name = "ali-garments"
database_id = "5fbfb37e-e24a-4b51-9401-e861ff4b6dc1"

# 2. Nightly Backup Cloudflare D1 Database Binding (Daily Every Night)
[[d1_databases]]
binding = "DB_BACKUP"
database_name = "ali-graments-backup"
database_id = "087a12df-88ef-4633-b81f-af6bad7a2098"
