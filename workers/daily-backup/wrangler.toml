name = "ali-garments-daily-backup"
main = "worker.js"
compatibility_date = "2024-09-23"

# Cron Trigger: Runs automatically every night at 20:00 UTC (1:00 AM Pakistan Standard Time)
[triggers]
crons = ["0 20 * * *"]

# 1. Primary Source Database Binding
[[d1_databases]]
binding = "DB"
database_name = "ali-garments"
database_id = "<YOUR_PRIMARY_D1_DATABASE_ID>"

# 2. Nightly Backup Target Database Binding
[[d1_databases]]
binding = "DB_BACKUP"
database_name = "ali-graments-backup"
database_id = "<YOUR_BACKUP_D1_DATABASE_ID>"
