<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#064e3b"/>
      <stop offset="50%" stop-color="#059669"/>
      <stop offset="100%" stop-color="#022c22"/>
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="50%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Rounded App Background -->
  <rect width="512" height="512" rx="128" fill="url(#bg)"/>
  
  <!-- Subtle border -->
  <rect x="8" y="8" width="496" height="496" rx="120" fill="none" stroke="rgba(255,255,255,0.15)" stroke-width="4"/>

  <!-- Inner Medallion -->
  <rect x="76" y="76" width="360" height="360" rx="90" fill="#020617" filter="url(#shadow)"/>
  <rect x="80" y="80" width="352" height="352" rx="86" fill="none" stroke="url(#gold)" stroke-width="4" stroke-opacity="0.6"/>

  <!-- Monogram AG -->
  <text x="256" y="270" font-family="'Times New Roman', serif" font-weight="900" font-size="160" fill="url(#gold)" text-anchor="middle" dominant-baseline="central">AG</text>
  
  <!-- Tagline -->
  <text x="256" y="365" font-family="'Inter', sans-serif" font-weight="700" font-size="24" fill="#34d399" text-anchor="middle" letter-spacing="4">ALI GARMENTS</text>
</svg>
